<!DOCTYPE html>
<html lang="eng">
@@include('html/head.html', {
'title': 'SXM Sailing'
})

<body>
	<div class="wrapper">
		@@include('html/header.html')
		<div class="video-background">
			<video class="bg-video" autoplay muted loop playsinline preload="auto"></video>

			<video class="bg-video" muted loop playsinline preload="auto"></video>
			<div class="overlay"></div>
		</div>
		<main class="page">
			<section class="hero">
				<div class="container hero__inner">
					
					
					<div class="video-nav hero__text">
						<button class="bg-video-arrow bg-video-arrow--prev" aria-label="Previous video">
							<svg class="icon" width="24" height="24">
								<use href="images/sprite.svg#arrow-chevron"></use>
							</svg>
						</button>

						<button class="bg-video-arrow bg-video-arrow--next" aria-label="Next video">
							<svg class="icon" width="24" height="24">
								<use href="images/sprite.svg#arrow-chevron"></use>
							</svg>
						</button>
					</div>
				</div>
			</section>
		</main>
		@@include('html/footer.html')
	</div>
</body>

</html>
